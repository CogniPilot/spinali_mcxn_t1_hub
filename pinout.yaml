  # ------------------------------------------------------------------ RGB LED chain
  - ref: RGB
    board: main
    name: LED CHAIN
    cat: spi
    function: "Output of the on-board RGB LED, solder pads"
    type: "Three pads marked CKO, SDO and G next to U14, 5 V logic"
    source: "kicad/mcu_io_1.kicad_sch"
    layout: single
    notes: >
      The MCU drives one SK9822 RGB LED (U14, APA102 compatible) from FlexIO pins P0_8 (data)
      and P0_9 (clock). CKO and SDO are the clock and data outputs of that LED, so more LEDs of
      the same type can be chained from here. The LED runs from 5 V, so its outputs are 5 V.
    pins:
      - {n: CKO, net: "P0_9/FLEXIO0_D1", cat: spi, label: "LED clock out", via: "RGB LED U14", pad: P0_9}
      - {n: SDO, net: "P0_8/FLEXIO0_D0", cat: spi, label: "LED data out",  via: "RGB LED U14", pad: P0_8}
      - {n: G,   net: GND, cat: gnd}

  # ------------------------------------------------------------------ RTC battery
  - ref: J13
    board: main
    name: RTC_BAT
    cat: rtc
    function: "Backup battery for the RTC"
    type: "JST-SH 1x2, side entry"
    source: "kicad/mcu_usb_power.kicad_sch"
    layout: single
    notes: >
      Keeps the real-time clock of the MCXN947 running without main power. Fits the RPi RTC
      battery (ML2020 with a 2-pin JST-SH plug). The same supply is on J8 pin 11 for the add-on
      board. The board charges the cell from 3.3 V through D15 and a 75 Ω resistor.
    alerts:
      - {type: warning, text: "The board trickle-charges this cell. Use a rechargeable ML2020 type, never a CR2032 or other non-rechargeable cell."}
    pins:
      - {n: 1, net: GND,     cat: gnd}
      - {n: 2, net: VDD_BAT, cat: rtc, label: "VBAT 3V", tag: "to MCU VBAT via D6"}

  # ------------------------------------------------------------------ switches
  - ref: SW1
    board: main
    name: ISP
    cat: boot
    function: "ISP boot button"
    type: "Tactile switch, bottom side"
    source: "kicad/mcu_io_1.kicad_sch"
    layout: summary
    summary: "Hold it while power comes up to start the boot ROM in ISP mode (P0_6 ISPMODE_N pulled low), for programming over USB or the debug UART. Normal boot otherwise."

